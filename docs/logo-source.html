<!DOCTYPE html>
<!--
  Source for assets/img/logo-512.png (512x512) and
  assets/img/apple-touch-icon.png (180x180).
  Rendered by capturing this file at each size.
  NOTE: structured data asks for the logo on a pure white background and at
  least 112x112, so this lockup is built on white.
-->
<html lang="en"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:512px; height:512px; overflow:hidden; background:#ffffff;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { width:512px; height:512px; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:34px; padding:40px; }
  .mark { width:250px; height:250px; border:12px solid #1b2a4a; }
  .mark i { display:block; height:26px; background:#1b2a4a; margin:24px 42px 0; }
  .mark i:nth-child(2) { opacity:.6; margin-top:26px; }
  .mark i:nth-child(3) { background:#a63d12; width:60%; margin-top:26px; }
  .name { font-size:38px; font-weight:700; color:#1b2a4a; letter-spacing:-.6px; text-align:center; }
  .sub { font-family:ui-monospace,Consolas,monospace; font-size:19px; letter-spacing:2.4px;
         text-transform:uppercase; color:#5c6270; margin-top:12px; text-align:center; }
</style></head><body>
<div class="wrap">
  <div class="mark"><i></i><i></i><i></i></div>
  <div>
    <div class="name">Al-Jilanee Textile</div>
    <div class="sub">Faisalabad · Pakistan</div>
  </div>
</div>
</body></html>
